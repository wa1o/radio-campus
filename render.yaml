# Blueprint de Render: servicio web gratuito conectado a un PostgreSQL externo.
# En Render: New > Blueprint > selecciona este repositorio.
services:
  - type: web
    name: radio-campus
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SCREEN_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STATION_TZ
        value: America/Mexico_City
      - key: STATION_LAT
        value: "22.2553"
      - key: STATION_LON
        value: "-97.8686"
